name: Deploy Next.js App via Cloud Assistant

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 步骤 1：登录阿里云ACR ---
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # --- 步骤 2：构建并推送镜像到ACR ---
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ALIYUN_REGISTRY }}/jade-demo/resume:latest

      # --- 步骤 3：安装并配置阿里云CLI（修改部分）---
      - name: Install and Upgrade Aliyun CLI
        run: |
          # 使用官方安装脚本安装最新版CLI
          curl -fsSL https://aliyuncli.alicdn.com/install.sh | bash
          # 强制升级所有组件，确保支持最新的API
          aliyun upgrade --force
          # 将aliyun命令添加到PATH，方便后续步骤使用
          echo "$HOME/.aliyun/bin" >> $GITHUB_PATH

      - name: Configure Aliyun CLI with RAM credentials
        run: |
          aliyun configure set --profile default --mode AK \
            --access-key-id ${{ secrets.ALIYUN_ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }} \
            --region cn-shanghai

      # --- 步骤 4：通过云助手远程执行部署命令（修改部分）---
      - name: Deploy on Simple Application Server via Cloud Assistant
        run: |
          # 构建要执行的Shell命令
          DEPLOY_COMMAND="
          docker login ${{ secrets.ALIYUN_REGISTRY }} -u ${{ secrets.ALIYUN_USERNAME }} -p ${{ secrets.ALIYUN_PASSWORD }} &&
          docker pull ${{ secrets.ALIYUN_REGISTRY }}/jade-demo/resume:latest &&
          docker stop my-nextjs-app || true &&
          docker rm my-nextjs-app || true &&
          docker run -d --name my-nextjs-app -p 3003:3003 -e NODE_ENV=production -e PORT=3003 -e HOSTNAME=0.0.0.0 --restart always ${{ secrets.ALIYUN_REGISTRY }}/jade-demo/resume:latest
          "
          
          # 关键修改：明确指定API版本 2020-06-01
          aliyun swas-open RunCommand \
            --api-version 2020-06-01 \
            --RegionId "cn-shanghai" \
            --InstanceId "803b51fa73d34db8be7c60e05b03aec4" \
            --Type "RunShellScript" \
            --CommandContent "$DEPLOY_COMMAND" \
            --Name "deploy-nextjs-app" \
            --Timeout 600

          echo "部署命令已通过轻量服务器命令助手发送成功！"