name: Deploy Next.js App via Cloud Assistant

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ALIYUN_REGISTRY }}/jade-demo/resume:latest

      - name: Install and configure Aliyun CLI
        run: |
          # 下载并解压
          wget -q http://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf aliyun-cli-linux-latest-amd64.tgz

          # 直接复制到系统路径（更可靠）
          sudo cp aliyun /usr/local/bin/
          sudo chmod +x /usr/local/bin/aliyun

          # 配置认证
          aliyun configure set \
            --profile default \
            --mode AK \
            --region cn-shanghai \
            --access-key-id ${{ secrets.ALIYUN_ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

          # 验证安装
          aliyun --version

      - name: Deploy on Simple Application Server via Cloud Assistant
        run: |
          DEPLOY_COMMAND="
          docker login ${{ secrets.ALIYUN_REGISTRY }} -u ${{ secrets.ALIYUN_USERNAME }} -p ${{ secrets.ALIYUN_PASSWORD }} &&
          docker pull ${{ secrets.ALIYUN_REGISTRY }}/jade-demo/resume:latest &&
          docker stop my-nextjs-app || true &&
          docker rm my-nextjs-app || true &&
          docker run -d --name my-nextjs-app -p 3000:3000 -e NODE_ENV=production -e PORT=3000 -e HOSTNAME=0.0.0.0 --restart always ${{ secrets.ALIYUN_REGISTRY }}/jade-demo/resume:latest
          "

          aliyun --product swas-open --version 2020-06-01 RunCommand \
            --RegionId "cn-shanghai" \
            --InstanceId "${{ secrets.ALIYUN_INSTANCE_ID }}" \
            --Type "RunShellScript" \
            --CommandContent "$DEPLOY_COMMAND" \
            --Name "deploy-nextjs-app" \
            --Timeout 600

          echo "✅ 部署命令已通过轻量服务器命令助手发送成功！"
